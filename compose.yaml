services:
  sabbia:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      SABBIA_DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/healthz');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
